{% extends 'courses/base.html' %}
{% load widget_tweaks %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger mt-3">
            <div class="card-body text-center">
                <h4 class="card-title text-danger mb-3">Are you sure?</h4>
                <p>Do you really want to cancel your enrollment in
                    <strong>{{ enrollment.course.title }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Cancel It</button>
                    <a href="{% url 'profile' %}" class="btn btn-secondary">No, Go Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
