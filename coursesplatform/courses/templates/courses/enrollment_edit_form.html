{% extends 'courses/base.html' %}

{% block title %}Update Enrollment{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 60px auto; padding: 0 15px;">
    <div style="background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <h3 style="margin-top:0; color:#1e293b;">{{ enrollment.course.title }}</h3>

        <form method="post">
            {% csrf_token %}
            <label style="display:flex; align-items:center; gap:8px; margin: 15px 0; font-weight:600; color:#334155;">
                {{ form.is_complete }} Mark as Completed
            </label>
            <button type="submit" style="background:#2c3e50; color:white; border:none; padding:10px 22px; border-radius:8px; cursor:pointer; font-weight:600;">Save</button>
        </form>
    </div>
</div>
{% endblock %}
